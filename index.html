<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">

    <style>
        /* --- ANIMASI PRELOADER ELEGAN & HALUS --- */
        #preloader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            background-color: #ffffff;
            z-index: 9999;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: opacity 0.8s cubic-bezier(0.25, 1, 0.5, 1), visibility 0.8s;
        }

        .loader-title {
            font-size: 28px;
            font-weight: 700;
            color: #1a202c;
            text-transform: uppercase;
            letter-spacing: -5px;
            opacity: 0;
            filter: blur(8px);
            animation: 
                revealText 1.2s cubic-bezier(0.25, 1, 0.5, 1) forwards,
                pulseText 1s ease-in-out infinite alternate 1.2s,
                fadeOutText 0.5s ease forwards 2.3s;
        }

        @keyframes revealText {
            100% {
                opacity: 1;
                letter-spacing: 6px;
                filter: blur(0);
            }
        }

        @keyframes pulseText {
            0% { opacity: 1; }
            100% { opacity: 0.5; }
        }

        @keyframes fadeOutText {
            100% {
                opacity: 0;
                letter-spacing: 10px;
                filter: blur(4px);
            }
        }

        #preloader.unloaded {
            opacity: 0;
            visibility: hidden;
        }

        /* --- TRANSISI MASUK KONTEN WEB --- */
        .main-content {
            opacity: 0;
            transform: translateY(30px);
            transition: opacity 1s cubic-bezier(0.25, 1, 0.5, 1), transform 1s cubic-bezier(0.25, 1, 0.5, 1);
        }

        body.ready .main-content {
            opacity: 1;
            transform: translateY(0);
        }

        body.loading {
            overflow: hidden;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            scroll-behavior: smooth;
        }

        body {
            background-color: #ffffff;
            color: #2d3748;
            line-height: 1.6;
        }

        /* Navbar */
        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            background-color: rgba(255, 255, 255, 0.95);
            border-bottom: 1px solid #e2e8f0;
            z-index: 1000;
        }

        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1100px;
            margin: 0 auto;
            padding: 20px;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            color: #1a202c;
        }

        .nav-links {
            display: flex;
            list-style: none;
        }

        .nav-links li {
            margin-left: 25px;
        }

        .nav-links a {
            text-decoration: none;
            color: #4a5568;
            font-weight: 500;
            transition: color 0.3s;
        }

        .nav-links a:hover {
            color: #3182ce;
        }

        /* Section Base */
        section {
            padding: 120px 20px 100px 20px;
            max-width: 100%;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .section-container {
            max-width: 1100px;
            width: 100%;
            margin: 0 auto;
        }

        #home { background-color: #ffffff; }
        #certificates { background-color: #f7fafc; border-top: 1px solid #edf2f7; border-bottom: 1px solid #edf2f7; }
        #skills { background-color: #ffffff; }
        #projects { background-color: #f7fafc; border-top: 1px solid #edf2f7; border-bottom: 1px solid #edf2f7; }
        #contact { background-color: #ffffff; border-top: 1px solid #edf2f7; }

        h2 {
            font-size: 32px;
            margin-bottom: 40px;
            text-align: center;
            position: relative;
            color: #1a202c;
        }

        h2::after {
            content: '';
            display: block;
            width: 50px;
            height: 3px;
            background-color: #3182ce;
            margin: 10px auto 0 auto;
            border-radius: 2px;
        }

        /* Home Section */
        .home-content {
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: space-between;
            gap: 50px;
        }

        .home-text {
            flex: 1;
        }

        .home-text h1 {
            font-size: 48px;
            color: #1a202c;
            margin-bottom: 15px;
        }

        .home-text p {
            font-size: 18px;
            color: #718096;
            margin-bottom: 20px;
        }

        .home-img {
            flex: 1;
            text-align: center;
        }
